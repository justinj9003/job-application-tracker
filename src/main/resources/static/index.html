<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Application Tracker</title>
</head>
<body>
<h1>Job Application Tracker</h1>
<h2>Add an application</h2>
<form id="add-form">
    <label>Company <input type="text" name="company" required></label>
    <label>Job Title <input type="text" name="jobTitle" required></label>

    <label>Status
        <select name="status">
            <option value="APPLIED">Applied</option>
            <option value="INTERVIEW">Interview</option>
            <option value="OFFER">Offer</option>
            <option value="REJECTED">Rejected</option>
        </select>
    </label>

    <label>Date Applied <input type="date" name="dateApplied" required></label>
    <label>Deadline <input type="date" name="deadline" ></label>
    <label>Notes <input type="text" name="notes" ></label>
    <button type="submit">Add</button>
</form>

<table border="1">
    <thead>
    <tr>
        <th>Company</th>
        <th>Job Title</th>
        <th>Status</th>
        <th>Date Applied</th>
        <th>Deadline</th>
        <th>Notes</th>
    </tr>
    </thead>

    <tbody id="applications">
    </tbody>
</table>
<script>
    async function loadApplications() {
        const response = await fetch("/applications");
        const applications = await response.json();

        const tbody = document.getElementById("applications");
        tbody.innerHTML = "";

        for (const app of applications) {
            const row = document.createElement("tr");
            addCell(row, app.company);
            addCell(row, app.jobTitle);
            addCell(row, app.status);
            addCell(row, app.dateApplied);
            addCell(row, app.deadline);
            addCell(row, app.notes);
            tbody.appendChild(row);
        }
    }

    function addCell(row, text) {
        const cell = document.createElement("td");
        cell.textContent = text ?? "";
        row.appendChild(cell);
    }
    document.getElementById("add-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = event.target;
        const data = Object.fromEntries(new FormData(form));
        if (data.deadline === "") {
            data.deadline = null;
        }

        const response = await fetch("/applications", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        });

        if (response.ok) {
            form.reset();
            loadApplications();
        } else {
            alert("Could not save the application.");
        }
    });

    loadApplications();
</script>
</body>
</html>
